[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "my-mpl-style"
version = "0.3.2"
description = "Publication-oriented matplotlib rcParams presets and 3D axes helpers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "chengtau", email = "1556632989@qq.com" }]
keywords = [
    "matplotlib",
    "style",
    "theme",
    "rcparams",
    "plotting",
    "visualization",
    "3d",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = ["matplotlib>=3.10", "numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/guessable/my-mpl-style"
Repository = "https://github.com/guessable/my-mpl-style"
Issues = "https://github.com/guessable/my-mpl-style/issues"
Changelog = "https://github.com/guessable/my-mpl-style/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5", "pytest>=8", "numpy>=1.24"]
examples = ["numpy>=1.24", "scikit-image>=0.20"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
my_mpl_style = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
